name: Windows Desktop Installer
on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the validated version as a prerelease
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 210
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - &line_endings
        name: Preserve source and patch line endings
        run: git config --global core.autocrlf false
      - &checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - &pinned
        id: source
        name: Read pinned upstream revision
        shell: pwsh
        run: |
          $package = Get-Content packaging/preview.json -Raw | ConvertFrom-Json
          if ($package.upstream -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid upstream commit' }
          "sha=$($package.upstream)" >> $env:GITHUB_OUTPUT
      - &upstream
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.source.outputs.sha }}
          path: upstream
          persist-credentials: false
      - &node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - &configure
        name: Configure Windows preview and upstream notices
        run: node packaging/prepare.mjs upstream
      - name: Verify Windows account-bound credential encryption
        run: node --experimental-strip-types acceptance/dpapi.mjs
      - &dependencies
        name: Install locked build dependencies
        working-directory: upstream
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          corepack prepare pnpm@11.28.5 --activate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
      - name: Check packaging configuration and Windows build tools
        working-directory: upstream
        run: pnpm --dir apps/desktop run package:win:x64:unsigned --check
      - name: Compile, seal, smoke-test and package Windows x64
        working-directory: upstream
        run: pnpm run package:desktop:win:x64:unsigned
      - name: Collect the NSIS installer
        shell: pwsh
        run: |
          $dir = 'upstream/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $files = @(Get-ChildItem -LiteralPath $dir -File -Filter 'deepseek-harness-*-win-x64-unsigned.exe')
          if ($files.Count -ne 1) { throw "Expected one installer, found $($files.Count)" }
          New-Item -Type Directory -Path dist | Out-Null
          Copy-Item -LiteralPath $files[0].FullName -Destination dist/DSH-Desktop-Setup-x64.exe
          $sha = (Get-FileHash dist/DSH-Desktop-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  DSH-Desktop-Setup-x64.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-preview
          path: dist/
          compression-level: 0
          if-no-files-found: error

  contracts:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - *line_endings
      - *checkout
      - *pinned
      - *upstream
      - *node
      - *configure
      - *dependencies
      - name: Compile official libraries and local configuration UI
        working-directory: upstream
        run: pnpm run build
      - name: Run actual provider form, discovery, tool-stream and policy tests
        working-directory: upstream
        shell: pwsh
        run: |
          pnpm exec vitest run packages/client/ui-settings-models/tests/provider-form.client.spec.tsx packages/llm/llm-pi-ai/tests/discovery.spec.ts packages/llm/llm-pi-ai/tests/protocol-roundtrip.spec.ts apps/desktop/tests/mandatory-update-policy.spec.ts --reporter=json --outputFile=contract-results.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $report = Get-Content contract-results.json -Raw | ConvertFrom-Json
          if ($report.numPassedTests -lt 4 -or $report.numFailedTests -ne 0) { throw 'Incomplete upstream contract test run' }
          "$($report.numPassedTests) passed, $($report.numPendingTests) skipped" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: provider-contracts
          path: upstream/contract-results.json
          if-no-files-found: error

  acceptance:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: Windows-x64-preview
          path: installer
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Prepare external test tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pefile==2024.8.26
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install --prefix "$env:RUNNER_TEMP/dsh-ui-test" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Install and exercise the downloaded package
        shell: pwsh
        run: ./acceptance/windows.ps1 -Artifacts installer -Evidence evidence -TestModules "$env:RUNNER_TEMP/dsh-ui-test"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.runner }}
          path: evidence/
          if-no-files-found: warn

  release:
    needs: [windows, acceptance, contracts]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_preview) ||
      (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish preview'))
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Windows-x64-preview
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: acceptance-*
          path: reports
      - name: Assemble verified acceptance report
        run: node acceptance/report.mjs
      - name: Publish verified preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./packaging/publish.ps1 -Directory dist
