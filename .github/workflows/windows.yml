name: Windows Desktop Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 210
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Preserve source and patch line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: source
        name: Read pinned upstream revision
        shell: pwsh
        run: |
          $package = Get-Content packaging/preview.json -Raw | ConvertFrom-Json
          if ($package.upstream -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid upstream commit' }
          "sha=$($package.upstream)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.source.outputs.sha }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Configure Windows preview and upstream notices
        run: node packaging/prepare.mjs upstream
      - name: Verify Windows account-bound credential encryption
        run: node --experimental-strip-types acceptance/dpapi.mjs
      - name: Install locked build dependencies
        working-directory: upstream
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          corepack prepare pnpm@11.28.5 --activate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
      - name: Check packaging configuration and Windows build tools
        working-directory: upstream
        run: pnpm --dir apps/desktop run package:win:x64:unsigned --check
      - name: Compile, seal, smoke-test and package Windows x64
        working-directory: upstream
        run: pnpm run package:desktop:win:x64:unsigned
      - name: Collect the NSIS installer
        shell: pwsh
        run: |
          $dir = 'upstream/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $files = @(Get-ChildItem -LiteralPath $dir -File -Filter 'deepseek-harness-*-win-x64-unsigned.exe')
          if ($files.Count -ne 1) { throw "Expected one installer, found $($files.Count)" }
          New-Item -Type Directory -Path dist | Out-Null
          Copy-Item -LiteralPath $files[0].FullName -Destination dist/DSH-Desktop-Setup-x64.exe
          $sha = (Get-FileHash dist/DSH-Desktop-Setup-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  DSH-Desktop-Setup-x64.exe" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-preview
          path: dist/
          compression-level: 0
          if-no-files-found: error
