services:
  harness:
    image: ghcr.io/agent-qingjiu/deepseek-harness-desktop:docker
    container_name: DeepSeek-Harness
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
    volumes:
      - ./data:/home/agent
      - ./workspace:/workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 4g
